<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoc Strength">
<meta name="format-detection" content="telephone=no">
<title>Zoc Strength</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<style>
:root{
  /* Zoc Strength : noir et or, « industriel premium ». Angles nets, filets fins, majuscules espacées, or réservé à l'action et aux records.
     Mise en page iPhone d'abord (393 pt de large) : grand titre en haut, barre d'onglets fixe en bas, zones sûres respectées. */
  --bg:#0A0A0A;
  --surface:#111111;
  --surface-2:#181818;
  --line:#262626;
  --line-2:#3A3A3A;
  --ink:#F2EDE4;
  --muted:#8D877C;
  --accent:#C9A24B;
  --accent-2:#E6C77A;
  --accent-ink:#0A0A0A;
  --gold:#E6C77A;
  --ok:#8FBF8A;
  --danger:#D9705F;
  --font-display:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --font-body:"Barlow",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --radius:3px;
  --nav-h:62px;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 20px);overscroll-behavior-y:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:400}
p{margin:0}
svg.i{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête */
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  padding:calc(var(--safe-t) + 10px) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));border-bottom:1px solid var(--line)}
.top-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:38px;height:38px;display:grid;place-items:center;color:var(--accent)}
.logo-mark svg{width:38px;height:38px}
.logo-txt{font-family:var(--font-display);font-size:25px;letter-spacing:.08em;line-height:1;white-space:nowrap}
.logo-txt span{color:var(--accent)}
.status{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;background:var(--muted)}
.status[data-s="cloud"]::before{background:var(--ok)}
.status[data-s="local"]::before,.status[data-s="slow"]::before{background:var(--accent)}
.status[data-s="error"]::before{background:var(--danger)}

/* Barre d'onglets en bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:6px calc(10px + var(--safe-r)) calc(6px + var(--safe-b)) calc(10px + var(--safe-l))}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding-bottom:4px;min-height:50px;position:relative}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav a:not(.center)[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:28px;height:2px;margin-left:-14px;background:var(--accent)}
.nav a.center .bubble{width:42px;height:42px;display:grid;place-items:center;margin:-30px 0 10px;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);transition:transform .2s;transform:rotate(45deg)}
.nav a.center .bubble svg{width:24px;height:24px;stroke-width:2;transform:rotate(-45deg)}
.nav a.center[aria-current="page"] .bubble{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav a.center[aria-current="page"] svg{color:var(--accent-ink)}
.nav a:active .bubble{transform:rotate(45deg) scale(.92)}
.nav .live{position:absolute;top:-34px;right:calc(50% - 38px);width:9px;height:9px;background:var(--ok);border:2px solid var(--bg);animation:pulse 1.6s infinite}

main{max-width:560px;margin:0 auto;padding:16px calc(16px + var(--safe-r)) 8px calc(16px + var(--safe-l));display:flex;flex-direction:column;gap:14px}
.page-title{font-family:var(--font-display);font-size:46px;line-height:.95;letter-spacing:.04em;margin-top:4px;position:relative;padding-bottom:10px}
.page-title::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:3px;background:var(--accent)}
.page-sub{color:var(--muted);font-size:15px;margin-top:2px}
.section-title{font-family:var(--font-display);font-size:25px;letter-spacing:.06em;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative}
.card.mark::before,.card.mark::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--accent);border-style:solid;pointer-events:none}
.card.mark::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.card.mark::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner{background:rgba(201,162,75,.08);border:1px solid rgba(201,162,75,.35);color:var(--ink);border-radius:var(--radius);padding:10px 12px;font-size:14px}

/* Boutons */
.btn{appearance:none;border:1px solid var(--line-2);background:transparent;border-radius:var(--radius);padding:0 16px;min-height:44px;cursor:pointer;font-weight:600;line-height:1.15;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;letter-spacing:.02em}
.btn:active{transform:scale(.97);background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:active{background:var(--accent-2)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.big{min-height:54px;font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.btn.huge{min-height:64px;font-family:var(--font-display);font-size:28px;letter-spacing:.1em;font-weight:400;width:100%}
.btn.full{width:100%}
.btn svg.i{width:20px;height:20px}

/* Champs : 16 px minimum pour éviter le zoom automatique d'iOS */
label.field{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.12em;flex:1;min-width:120px}
input.in{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:0 12px;min-height:48px;color:var(--ink);font-size:17px;width:100%;-webkit-appearance:none;appearance:none;letter-spacing:0}
input.in::placeholder{color:#55514A}
input.in:focus{outline:none;border-color:var(--accent)}
input[type="date"].in{padding-top:12px;padding-bottom:12px}
textarea.in{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 12px;color:var(--ink);font-size:16px;width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
textarea.in:focus{outline:none;border-color:var(--accent)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 12px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;border-radius:2px}
.chip.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip svg.i{width:13px;height:13px;stroke-width:2.2}

.empty{text-align:center;padding:26px 16px 22px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--font-display);font-size:28px;letter-spacing:.05em;font-weight:400}
.illu{width:220px;height:auto;margin-bottom:4px;color:var(--accent)}

/* Stats d'accueil */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.stat{padding:12px 12px 10px;display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--line)}
.stat:first-child{border-left:none}
.stat .v{font-family:var(--font-display);font-size:34px;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:17px;color:var(--muted)}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.heat{grid-column:1 / -1;border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.heat-row{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat-row i{aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line)}
.heat-row i.l1{background:rgba(201,162,75,.35);border-color:transparent}
.heat-row i.l2{background:rgba(201,162,75,.65);border-color:transparent}
.heat-row i.l3{background:var(--accent);border-color:transparent}
.heat-row i.now{outline:1px solid var(--ink);outline-offset:1px}
.heat-legend{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Programme */
.prog-card{display:flex;flex-direction:column;gap:10px}
.prog-card h3{font-family:var(--font-display);font-size:30px;letter-spacing:.05em;line-height:1}
.prog-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.prog-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.prog-list li .x3{font-family:var(--font-display);font-size:20px;color:var(--accent);letter-spacing:.06em}
.ed-row{display:grid;grid-template-columns:22px 1fr;grid-template-areas:"idx name" ". ctl";gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ed-row .idx{grid-area:idx;font-family:var(--font-display);color:var(--accent);font-size:24px;text-align:center}
.ed-row > input{grid-area:name}
.ed-ctl{grid-area:ctl;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.stepper button{border:none;background:transparent;width:44px;height:44px;cursor:pointer;font-size:22px;color:var(--ink)}
.stepper button:active{background:var(--surface-2)}
.stepper output{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:44px}
.ed-tools{display:flex}
.ed-tools .btn{min-width:40px;padding:0 8px}

/* Séance du jour : choix */
.pick{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;transition:transform .12s,border-color .15s}
.pick:active{transform:scale(.985);border-color:var(--accent)}
.pick:disabled{opacity:.5}
.pick h3{font-family:var(--font-display);font-size:32px;letter-spacing:.05em;line-height:1}
.pick .meta{font-size:13.5px;color:var(--muted)}
.pick .go{width:48px;height:48px;flex-shrink:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.pick .go svg{width:22px;height:22px;stroke-width:2.2}
.pick .bg-plate{position:absolute;right:-30px;bottom:-40px;width:130px;height:130px;color:rgba(201,162,75,.07);pointer-events:none;stroke-width:1.2}

/* Séance du jour : en cours */
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.progress{height:6px;background:var(--surface-2);overflow:hidden;position:relative}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--bg) calc(10% - 2px) 10%)}
.kicker{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.ex-num{font-family:var(--font-display);font-size:66px;line-height:.8;color:transparent;-webkit-text-stroke:1px var(--accent);letter-spacing:.03em}
.ex-title{font-family:var(--font-display);font-size:46px;line-height:.92;letter-spacing:.04em}
.ex-title.sm{font-size:34px}
.planned{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.planned b{font-family:var(--font-display);font-size:28px;color:var(--accent);font-weight:400;letter-spacing:.03em}
.last{background:var(--bg);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.last-head{display:flex;align-items:center;gap:8px}
.last-head svg{color:var(--accent);width:18px;height:18px}
.last-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.last-sets span{background:var(--surface);border:1px solid var(--line);padding:8px 6px;text-align:center;font-family:var(--font-display);font-size:22px;letter-spacing:.04em;line-height:1}
.last-sets span small{display:block;font-family:var(--font-body);font-size:10px;color:var(--muted);letter-spacing:.14em;margin-bottom:5px;font-weight:700}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;background:transparent;border:1px solid var(--line-2)}
.dots i.done{background:var(--accent);border-color:var(--accent)}
.dots i.cur{border:2px solid var(--accent)}
.dots i.just{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.set-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.set-n{font-family:var(--font-display);font-size:26px;letter-spacing:.06em;color:var(--muted)}
.set-n b{color:var(--ink);font-weight:400;font-size:34px}
.set-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numbox{display:flex;flex-direction:column;gap:6px}
.numbox label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:center}
.numbox input{font-family:var(--font-display);font-size:60px;line-height:1;text-align:center;padding:10px 4px 6px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--radius);width:100%;color:var(--ink);letter-spacing:.03em;-webkit-appearance:none;appearance:none;min-height:88px}
.numbox input::placeholder{color:#34312C}
.numbox input:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.steps button{min-height:44px;border:none;background:transparent;font-weight:700;font-size:15px;cursor:pointer;transition:background .1s}
.steps button + button{border-left:1px solid var(--line-2)}
.steps button:active{background:var(--surface-2);color:var(--accent)}
.hint{font-size:14px;color:var(--muted);text-align:center}
.pr-hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--accent-2);font-weight:700;font-size:14px;letter-spacing:.04em;animation:glow 1.4s ease-in-out infinite}
.pr-hint[hidden]{display:none}
.today-sets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.today-sets li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:16px}
.today-sets li.just{animation:slideIn .4s cubic-bezier(.2,.8,.2,1)}
.today-sets .sn{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--accent);color:var(--accent);font-family:var(--font-display);font-size:17px;margin-right:10px}
.fix{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fix input{width:78px;text-align:center}
.side-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card.flash{animation:flash .5s ease-out}

/* Résumé */
.done-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 16px;background:var(--surface)}
.trophy{width:96px;height:96px;color:var(--accent);animation:bounceIn .7s cubic-bezier(.2,1.5,.4,1)}
.trophy svg{width:100%;height:100%}
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.sum-grid .tile{border:none;border-left:1px solid var(--line);border-radius:0;background:transparent}
.sum-grid .tile:first-child{border-left:none}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.tile .v{font-family:var(--font-display);font-size:36px;line-height:1;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:17px;color:var(--muted)}
.tile .l{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.tile .s{font-size:13px;color:var(--muted);margin-top:4px}
.tile.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.gold .l,.tile.gold .s,.tile.gold .v small{color:rgba(10,10,10,.7)}
.tile.gold .l{display:flex;align-items:center;gap:5px}
.tile.gold .l svg{width:14px;height:14px;stroke-width:2.2}
.up{color:var(--ok);font-weight:700}
.down{color:var(--danger);font-weight:700}
.tile.gold .up,.tile.gold .down{color:var(--accent-ink)}
.sum-ex{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.sum-ex:first-of-type{border-top:none}
.sum-ex .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.sum-ex .d{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.records{display:flex;flex-direction:column;gap:6px}
.records div{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:24px;letter-spacing:.04em}
.records svg{width:20px;height:20px}

/* Progression */
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.seg button{border:none;background:transparent;min-height:42px;padding:0 4px;cursor:pointer;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;line-height:1.15;transition:background .2s,color .2s}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chart-box{position:relative;height:240px;margin:0 -6px}
.grp h3{font-family:var(--font-display);font-size:24px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.grp h3 svg{color:var(--accent);width:20px;height:20px}
.ex-btns{display:flex;flex-direction:column;margin-top:6px}
.ex-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-top:1px solid var(--line);padding:12px 8px;min-height:52px;cursor:pointer;border-radius:0;transition:background .15s;position:relative}
.ex-btn:active{background:var(--surface-2)}
.ex-btn[aria-pressed="true"]{background:var(--surface-2)}
.ex-btn[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:-1px;bottom:0;width:3px;background:var(--accent)}
.ex-btn[aria-pressed="true"] .n{color:var(--accent)}
.ex-btn .n{font-weight:600;font-size:16px}
.ex-btn .m{font-family:var(--font-display);font-size:20px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;display:flex;align-items:center}
.ex-btn:disabled{cursor:default}
.spark{width:64px;height:24px;margin-left:10px}
details summary{list-style:none;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;min-height:36px;display:flex;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";font-size:18px;width:20px;color:var(--accent)}
details[open] summary::before{content:"−"}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.data td.r,table.data th.r{text-align:right}
table.data tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.hist{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.hist:first-of-type{border-top:none}
.hist h4{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist ul{margin:0;padding:0;list-style:none;font-size:15px;display:flex;flex-direction:column;gap:3px}
.hist ul span{color:var(--muted);font-variant-numeric:tabular-nums}
.edit-ex{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.edit-set{display:flex;gap:6px;align-items:center}
.edit-set input{width:80px;text-align:center}

/* Animations */
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideX{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(143,191,138,.6)}50%{box-shadow:0 0 0 6px rgba(143,191,138,0)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes flash{0%{border-color:var(--accent);box-shadow:0 0 0 0 rgba(201,162,75,.5)}100%{box-shadow:0 0 0 14px rgba(201,162,75,0)}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:var(--len, 400)}to{stroke-dashoffset:0}}
.screen-enter > *{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
.screen-enter > *:nth-child(2){animation-delay:.04s}
.screen-enter > *:nth-child(3){animation-delay:.08s}
.screen-enter > *:nth-child(4){animation-delay:.12s}
.screen-enter > *:nth-child(n+5){animation-delay:.16s}
.ex-enter .ex-anim{animation:slideX .45s cubic-bezier(.2,.8,.2,1) both}
.trophy .draw{stroke-dasharray:var(--len, 400);animation:draw 1.1s .15s cubic-bezier(.4,0,.2,1) both}

#burst{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(var(--nav-h) + var(--safe-b) + 24px);z-index:40;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--radius);font-size:15px;font-weight:600;
  max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.gold{background:var(--accent)}
#toast svg.i{width:18px;height:18px;stroke-width:2.2}

@media (min-width:600px){ .page-title{font-size:54px} .tiles{grid-template-columns:repeat(4,1fr)} }
@media (max-width:360px){ .numbox input{font-size:48px;min-height:76px} .ex-title{font-size:40px} .stat .v{font-size:28px} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="logo">
      <span class="logo-mark" id="logo-mark"></span>
      <span class="logo-txt">ZOC <span>STRENGTH</span></span>
    </div>
    <span class="status" id="status" data-s="loading">Chargement…</span>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="nav" aria-label="Sections">
  <div class="nav-inner">
    <a href="#programme" data-tab="programme"><span data-icon="clipboard"></span><span>Programme</span></a>
    <a href="#seance" data-tab="seance" class="center"><span class="bubble" data-icon="dumbbell"></span><span>Séance du jour</span></a>
    <a href="#progression" data-tab="progression"><span data-icon="chart"></span><span>Progression</span></a>
  </div>
</nav>
<canvas id="burst" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>

function todayISO(){ const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function dateObj(iso){ const [y,m,d] = String(iso).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function daysAgo(iso){ return Math.round((dateObj(todayISO()) - dateObj(iso)) / 86400000); }
const fmtDate = (iso, opt={weekday:"short", day:"numeric", month:"short"}) => dateObj(iso).toLocaleDateString("fr-FR", opt);
function whenTxt(iso){ const d = daysAgo(iso); return d === 0 ? "aujourd'hui" : d === 1 ? "hier" : d > 1 && d < 7 ? "il y a " + d + " jours" : "le " + fmtDate(iso, {day:"numeric", month:"long"}); }
function e1rm(kg, reps){ kg = +kg || 0; reps = +reps || 0; if (kg <= 0 || reps <= 0) return 0; return reps === 1 ? kg : kg * (1 + reps / 30); }
const plural = (n, w, wp) => n + " " + (n > 1 ? (wp || w + "s") : w);
function setsTxt(sets){ const ok = (sets || []).filter(s => +s.reps > 0); return ok.map(s => s.reps + " × " + kgf(+s.kg || 0)).join(" · ") + (ok.length ? " kg" : ""); }
function volOf(sets){ return (sets || []).reduce((t, s) => t + (+s.kg || 0) * (+s.reps || 0), 0); }
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }

/* ================= État ================= */
const S = {
  programs: [], sessions: [], active: null, summary: null,
  view: "seance", edit: null, confirm: null, fixing: null,
  progKey: null, progMetric: null, editSess: null, histLimit: 15,
  status: "loading", dirty: false, activeLoaded: false,
  screenKey: null, justDone: null, curBest: null, pasteOpen: false, exportText: null
};
function sortSessions(){ S.sessions.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt||0) - (a.createdAt||0)); }
function applyProfile(p){ S.programs = Array.isArray(p && p.programs) ? clone(p.programs) : []; }
function validActive(a){ return a && !a.empty && Array.isArray(a.exercises) && a.exercises.length && typeof a.ei === "number"; }

/* ================= Stockage ================= */
let backend = null;
function writer(fn){
  let busy = false, pending = null;
  async function run(){
    busy = true;
    while (pending){
      const d = pending; pending = null;
      try { await fn(d); }
      catch(e){
        if (e && e.code === "unavailable"){ await new Promise(r => setTimeout(r, 600 + Math.random()*900)); try { await fn(d); } catch(e2){ writeError(e2); } }
        else writeError(e);
      }
    }
    busy = false;
  }
  return d => { pending = d; if (!busy) run(); };
}
function writeError(e){
  const c = e && e.code;
  if (c === "quota_exceeded") toast("Espace de stockage plein : supprime d'anciennes séances pour continuer.");
  else if (c === "invalid_argument") toast("Enregistrement refusé : ce compte ne peut pas écrire ici.");
  else if (c === "revoked") { S.status = "error"; renderStatus(); toast("Accès aux données interrompu. Recharge la page."); }
  else toast("Impossible d'enregistrer pour l'instant. Réessaie dans un moment.");
}
function cloudBackend(db, uid, onFirst){
  const profileRef = db.doc("data/users/" + uid + "/profile");
  const sessionsCol = profileRef.collection("sessions");
  const activeRef = db.doc("data/users/" + uid + "/active");
  const wProfile = writer(d => profileRef.update(d).catch(e => { if (e && e.code === "invalid_argument") return profileRef.set(d); throw e; }));
  const wActive = writer(d => activeRef.set(d));
  const ready = () => { onFirst(); if (S.status !== "error"){ S.status = "cloud"; renderStatus(); } };
  const fail = e => { onFirst(); S.status = "error"; renderStatus(); if (e && e.code !== "revoked") toast("Tes données ne peuvent pas être chargées pour l'instant."); };
  return {
    start(){
      profileRef.onSnapshot(snap => { if (snap.exists) applyProfile(snap.data()); if (!snap.metadata.fromCache) ready(); softRender(); }, fail);
      sessionsCol.onSnapshot(snap => {
        S.sessions = snap.docs.map(d => Object.assign({id:d.id}, clone(d.data()))).filter(s => s.date && Array.isArray(s.exercises));
        sortSessions(); if (!snap.metadata.fromCache) ready(); softRender();
      }, fail);
      activeRef.get().then(snap => {
        S.activeLoaded = true;
        if (snap.exists && !S.active && !S.summary){ const a = clone(snap.data()); if (validActive(a)){ S.active = a; } }
        softRender();
      }).catch(() => { S.activeLoaded = true; softRender(); });
    },
    savePrograms: () => wProfile({programs: clone(S.programs)}),
    saveActive: () => wActive(S.active ? clone(S.active) : {empty:true}),
    saveSession(s){ const body = clone(s); delete body.id; return sessionsCol.doc(s.id).set(body); },
    deleteSession: id => sessionsCol.doc(id).delete()
  };
}
function localBackend(){
  const KEY = "carnet-muscu-v1-local";
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({programs:S.programs, sessions:S.sessions, active:S.active})); } catch(e){} };
  return {
    start(){
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "null");
        if (raw){ applyProfile(raw); if (Array.isArray(raw.sessions)) S.sessions = raw.sessions; if (validActive(raw.active)) S.active = raw.active; sortSessions(); }
      } catch(e){}
      S.activeLoaded = true; S.status = "local"; renderStatus(); render();
    },
    savePrograms: persist, saveActive: persist,
    async saveSession(s){ S.sessions = S.sessions.filter(x => x.id !== s.id); S.sessions.push(clone(s)); sortSessions(); persist(); },
    async deleteSession(id){ S.sessions = S.sessions.filter(x => x.id !== id); persist(); }
  };
}
async function initStore(){
  const slow = setTimeout(() => { if (S.status === "loading"){ S.status = "slow"; renderStatus(); } }, 10000);
  let done = false; const onFirst = () => { if (!done){ done = true; clearTimeout(slow); } };
  let db = null, user = null, uid = null;
  if (window.claude && typeof window.claude.use === "function"){
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch(e){}
    if (db && user){ try { uid = await user.id(); } catch(e){} }
  }
  if (db && uid) backend = cloudBackend(db, uid, onFirst);
  else { onFirst(); backend = localBackend(); }
  backend.start();
}
const savePrograms = () => backend && backend.savePrograms();
const saveActive = () => backend && backend.saveActive();

/* ================= Analyse ================= */
function analyze(){
  const asc = [...S.sessions].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt||0) - (b.createdAt||0));
  const perEx = {}, best = {}, prs = {};
  for (const s of asc){
    for (const e of (s.exercises || [])){
      const sets = (e.sets || []).filter(x => (+x.reps) > 0);
      if (!sets.length) continue;
      const k = keyOf(e.name);
      const maxKg = Math.max(...sets.map(x => +x.kg || 0));
      const maxReps = Math.max(...sets.map(x => +x.reps));
      const bestE = Math.max(...sets.map(x => e1rm(x.kg, x.reps)));
      const vol = volOf(sets);
      const pe = perEx[k] || (perEx[k] = {name:e.name, points:[]});
      pe.name = e.name;
      pe.points.push({id:s.id, date:s.date, maxKg, maxReps, bestE, vol, sets, nSets:sets.length});
      const b = best[k];
      if (b && (maxKg > b.kg || (maxKg === 0 && b.kg === 0 && maxReps > b.reps))) (prs[s.id] || (prs[s.id] = [])).push({name:e.name, kg:maxKg, reps:maxReps});
      if (!b) best[k] = {kg:maxKg, kgDate:s.date, reps:maxReps, e1:bestE, vol, n:1};
      else { if (maxKg > b.kg){ b.kg = maxKg; b.kgDate = s.date; } b.reps = Math.max(b.reps, maxReps); b.e1 = Math.max(b.e1, bestE); b.vol = Math.max(b.vol, vol); b.n++; }
    }
  }
  return {perEx, best, prs};
}
function lastFor(name, excludeId){
  const k = keyOf(name);
  for (const s of S.sessions){
    if (s.id === excludeId) continue;
    const e = (s.exercises || []).find(x => keyOf(x.name) === k);
    if (e && (e.sets || []).some(x => +x.reps > 0)) return {date:s.date, sets:e.sets.filter(x => +x.reps > 0)};
  }
  return null;
}

const view = $("#view");
function renderStatus(){
  const el = $("#status");
  const map = {loading:"Chargement…", cloud:"Synchronisé", local:"Sur cet appareil", slow:"Connexion lente", error:"Hors ligne"};
  el.dataset.s = S.status; el.textContent = map[S.status] || "";

function inputFocused(){ const ae = document.activeElement; return ae && view.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName); }
function softRender(){ if (inputFocused()){ S.dirty = true; return; } render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (S.dirty && !inputFocused()) render(); }, 0));

let chart = null;
function screenKey(){
  if (S.view !== "seance") return S.view + (S.edit ? ":edit" : "");
  if (S.summary) return "seance:summary";
  if (S.active) return "seance:run:" + S.active.ei + ":" + S.active.phase;
  return "seance:pick";
}
function render(){
  S.dirty = false;
  const ae = document.activeElement, fid = ae && view.contains(ae) ? ae.id : null;
  let ss = null, se = null; try { ss = ae.selectionStart; se = ae.selectionEnd; } catch(e){}
  document.querySelectorAll(".nav a").forEach(a => {
    if (a.dataset.tab === S.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const live = $(".nav a.center .live");
  if (S.active && !live) $(".nav a.center").insertAdjacentHTML("beforeend", '<span class="live" title="Séance en cours"></span>');
  if (!S.active && live) live.remove();
  if (chart){ chart.destroy(); chart = null; }
  const A = analyze();
  if (S.view === "programme") view.innerHTML = viewProgramme(A);
  else if (S.view === "progression"){ view.innerHTML = viewProgression(A); drawChart(A); }
  else view.innerHTML = viewSeance(A);
  // Animation d'entrée seulement quand l'écran change vraiment
  const key = screenKey();
  view.classList.remove("screen-enter", "ex-enter");
  if (key !== S.screenKey){
    void view.offsetWidth;
    view.classList.add(key.startsWith("seance:run:") && key.endsWith(":intro") && S.screenKey && S.screenKey.startsWith("seance:run:") ? "ex-enter" : "screen-enter");
    S.screenKey = key;
  }
  S.justDone = null;
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); try { if (ss != null) el.setSelectionRange(ss, se); } catch(e){} } }
  const af = view.querySelector("[data-autofocus]");
  if (af && !fid) af.focus({preventScroll:true});
  countUp();
}
function countUp(){
  view.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count, dec = +el.dataset.dec || 0;
    const fmt = v => dec ? kgf(v) : intf(v);
    if (reduced() || !target){ el.textContent = fmt(target); return; }
    const t0 = performance.now(), dur = 900;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(target * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

  for (const p of S.programs) for (const e of p.exercises) if (e.name.trim()) m.set(keyOf(e.name), e.name.trim());
  for (const s of S.sessions) for (const e of (s.exercises || [])) if (e.name && !m.has(keyOf(e.name))) m.set(keyOf(e.name), e.name);
  return [...m.values()].sort((a,b) => a.localeCompare(b, "fr"));
}

const LB_KEY = "zoc-last-backup";
function getLastBackup(){ try { return +localStorage.getItem(LB_KEY) || 0; } catch(e){ return 0; } }
function markBackup(){ try { localStorage.setItem(LB_KEY, String(Date.now())); } catch(e){} }
function backupCard(){

    ${S.exportText ? `<label class="field" for="bk-out">LA COPIE AUTOMATIQUE N'A PAS MARCHÉ : SÉLECTIONNE ET COPIE CE TEXTE<textarea class="in" id="bk-out" readonly>${esc(S.exportText)}</textarea></label>` : ""}

async function doExport(){
  const txt = JSON.stringify({app:"zoc-strength", version:1, exportedAt:new Date().toISOString(), programs:S.programs, sessions:S.sessions});
  const name = "zoc-strength-" + todayISO() + ".json";
  if (PWA){
    try {
      const f = new File([txt], name, {type:"application/json"});
      if (navigator.canShare && navigator.canShare({files:[f]})){
        await navigator.share({files:[f], title:"Sauvegarde Zoc Strength"});
        markBackup(); render(); toast("Sauvegarde exportée.", "check"); return;
      }
    } catch(e){ if (e && e.name === "AbortError") return; }
    try {
      const url = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      markBackup(); render(); toast("Sauvegarde téléchargée.", "check"); return;
    } catch(e){}
  }
  try {
    await navigator.clipboard.writeText(txt);
    markBackup(); S.exportText = null; render();
    toast(PWA ? "Données copiées." : "Données copiées. Colle-les dans l'appli iPhone : Programme › Sauvegarde › Coller.", "check");
  } catch(e){ S.exportText = txt; render(); const el = $("#bk-out"); if (el){ el.focus(); el.select(); } }
}
async function doImport(txt){
  let d; try { d = JSON.parse(txt); } catch(e){ toast("Ce texte n'est pas une sauvegarde valide."); return; }
  const cleanId = (v, p) => String(v || "").replace(/[^A-Za-z0-9_\-.~:@+]/g, "").slice(0, 60) || newId(p);
  const sessions = Array.isArray(d && d.sessions) ? d.sessions.filter(s => s && s.date && Array.isArray(s.exercises)) : [];
  const programs = Array.isArray(d && d.programs) ? d.programs.filter(p => p && p.name && Array.isArray(p.exercises)) : [];
  if (!sessions.length && !programs.length){ toast("Aucune donnée trouvée dans cette sauvegarde."); return; }
  for (const p of programs){
    const c = {id: cleanId(p.id, "p"), name: String(p.name).slice(0, 80), exercises: p.exercises.map(e => ({name: String(e.name || "").trim().slice(0, 80), sets: Math.min(20, Math.max(1, Math.round(num(e.sets)) || 3))})).filter(e => e.name)};
    const i = S.programs.findIndex(x => x.id === c.id);
    if (i >= 0) S.programs[i] = c; else S.programs.push(c);
  }
  if (programs.length) savePrograms();
  let n = 0;
  for (const s of sessions){
    const c = {id: cleanId(s.id, "s"), programId: String(s.programId || ""), programName: String(s.programName || s.title || "Séance"), date: String(s.date).slice(0, 10),
      startedAt: +s.startedAt || null, endedAt: +s.endedAt || null, createdAt: +s.createdAt || Date.now(),
      exercises: s.exercises.map(e => ({name: String(e.name || "Exercice"), sets: (e.sets || []).map(x => ({reps: Math.max(0, Math.round(num(x.reps))), kg: Math.max(0, num(x.kg))})).filter(x => x.reps > 0)})).filter(e => e.sets.length)};
    if (!c.exercises.length) continue;
    try { await backend.saveSession(c); n++; } catch(e){ writeError(e); break; }
  }
  S.pasteOpen = false; render();
  const parts = []; if (programs.length) parts.push(plural(programs.length, "séance") + " de programme"); if (n) parts.push(plural(n, "séance") + " d'historique");
  toast("Import terminé : " + (parts.join(" et ") || "rien de nouveau") + ".", "check");
}

/* ================= Onglet Séance du jour ================= */
function viewSeance(A){
  if (S.summary) return viewSummary();
  if (S.active) return viewRun(A);
  if (S.status === "loading" && !S.activeLoaded) return `<div class="card empty"><span>Chargement de tes séances…</span></div>`;
  if (!S.programs.length) return `${localBanner()}${pageHead("Séance du jour")}<div class="card empty">${ILLU_BARBELL}<strong>Rien à lancer pour l'instant</strong><span>Crée d'abord tes séances dans l'onglet Programme : le nom, les exercices et le nombre de séries.</span><a class="btn primary big" href="#programme">Aller au programme</a></div>`;
  const lastByProg = {};
  for (const s of S.sessions) if (s.programId && !lastByProg[s.programId]) lastByProg[s.programId] = s.date;
  const h = new Date().getHours();
  return `
  ${localBanner()}
  ${pageHead("Séance du jour", h < 12 ? "Bonne séance ce matin, Zoc." : h < 18 ? "Prêt pour la séance, Zoc ?" : "Séance du soir, allez Zoc.")}
  ${statsBlock()}
  <span class="kicker" style="margin-top:4px">Choisis ta séance</span>
  ${S.programs.map(p => `
    <button class="pick" type="button" data-action="run-start" data-id="${esc(p.id)}" ${p.exercises.length ? "" : "disabled"}>
      ${ic("plate", "i bg-plate")}
      <span class="stack" style="gap:5px;min-width:0">
        <h3>${esc(p.name)}</h3>
        <span class="meta">${p.exercises.length ? plural(p.exercises.length, "exercice") + " · " + plural(p.exercises.reduce((t,e) => t + e.sets, 0), "série") : "Aucun exercice : complète-la dans Programme"}</span>
        <span class="meta" style="display:flex;align-items:center;gap:5px">${ic("history", "i")}${lastByProg[p.id] ? "Dernière fois " + esc(whenTxt(lastByProg[p.id])) : "Jamais faite"}</span>
      </span>
      <span class="go">${ic("arrow", "i")}</span>
    </button>`).join("")}`;
}
function mondayISO(iso){ const d = dateObj(iso); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function shiftWeek(iso, n){ const d = dateObj(iso); d.setDate(d.getDate() + 7 * n); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function statsBlock(){
  if (!S.sessions.length) return "";
  const month = todayISO().slice(0, 7);
  const nMonth = S.sessions.filter(s => String(s.date).slice(0, 7) === month).length;
  const perWeek = {};
  for (const s of S.sessions){ const k = mondayISO(s.date); perWeek[k] = (perWeek[k] || 0) + 1; }
  const thisWeek = mondayISO(todayISO());
  let cur = perWeek[thisWeek] ? thisWeek : shiftWeek(thisWeek, -1), streak = 0;
  while (perWeek[cur]){ streak++; cur = shiftWeek(cur, -1); }
  const vol = S.sessions.reduce((t, s) => t + (s.exercises || []).reduce((u, e) => u + volOf(e.sets), 0), 0);
  const volTxt = vol >= 10000 ? `<span data-count="${Math.round(vol / 100) / 10}" data-dec="1">0</span><small> t</small>` : `<span data-count="${Math.round(vol)}">0</span><small> kg</small>`;
  const weeks = Array.from({length: 12}, (_, i) => shiftWeek(thisWeek, i - 11));
  return `
  <section class="stats" aria-label="Tes statistiques">
    <div class="stat"><span class="v"><span data-count="${nMonth}">0</span></span><span class="l">Séance${nMonth > 1 ? "s" : ""} ce mois</span></div>
    <div class="stat"><span class="v"><span data-count="${streak}">0</span><small> sem.</small></span><span class="l">D'affilée</span></div>
    <div class="stat"><span class="v">${volTxt}</span><span class="l">Soulevés au total</span></div>
    <div class="heat">
      <div class="heat-row" role="img" aria-label="Séances par semaine sur les 12 dernières semaines">${weeks.map(w => { const n = perWeek[w] || 0; return `<i class="${n >= 3 ? "l3" : n === 2 ? "l2" : n === 1 ? "l1" : ""}${w === thisWeek ? " now" : ""}" title="Semaine du ${esc(fmtDate(w, {day:"numeric", month:"short"}))} : ${n} séance${n > 1 ? "s" : ""}"></i>`; }).join("")}</div>
      <div class="heat-legend"><span>12 dernières semaines</span><span>Cette semaine</span></div>
    </div>
  </section>`;
}
function runProgress(a){
  const planned = a.exercises.reduce((t, e) => t + (e.skipped && !e.sets.length ? 0 : Math.max(e.planned, e.sets.length)), 0);
  const done = a.exercises.reduce((t, e) => t + e.sets.length, 0);
  return planned ? Math.round(done / planned * 100) : 0;
}
function viewRun(A){
  const a = S.active, e = a.exercises[a.ei];
  const last = lastFor(e.name);
  const b = A.best[keyOf(e.name)];
  const todayMax = e.sets.length ? Math.max(...e.sets.map(s => +s.kg || 0)) : 0;
  S.curBest = b ? Math.max(b.kg, todayMax) : null;
  const pr = runProgress(a);
  const head = `
  <div class="stack" style="gap:8px">
    <div class="run-top"><span>${esc(a.programName)}</span><span class="num">${pr} %</span></div>

    ? `<div class="last"><div class="last-head">${ic("history")}<span class="kicker">La dernière fois · ${esc(whenTxt(last.date))}</span></div>
        <div class="last-sets">${last.sets.map((s, i) => `<span><small>SÉRIE ${i+1}</small>${s.reps} × ${kgf(+s.kg || 0)}<small style="margin:4px 0 0">kg</small></span>`).join("")}</div>
        <div class="head-row small muted"><span>Volume : <b class="num" style="color:var(--ink)">${intf(volOf(last.sets))} kg</b></span>${b ? `<span class="chip gold">${ic("flame")}Record ${b.kg > 0 ? kgf(b.kg) + " kg" : b.reps + " reps"}</span>` : ""}</div></div>`

    ? `<div class="confirm">Terminer maintenant ? Les séries faites seront enregistrées.<button class="btn sm primary" type="button" data-action="run-finish-yes">Terminer</button><button class="btn sm" type="button" data-action="confirm-no">Continuer</button></div>`

    ? `<div class="confirm">Abandonner la séance sans rien enregistrer ?<button class="btn sm danger" type="button" data-action="run-abandon-yes">Abandonner</button><button class="btn sm" type="button" data-action="confirm-no">Continuer</button></div>`
    : `<div class="side-actions"><button class="btn ghost sm" type="button" data-action="run-finish">Terminer la séance</button><button class="btn ghost sm danger" type="button" data-action="run-abandon">Abandonner</button></div>`;

  if (a.phase === "intro"){
    const prev = a.ei > 0 ? a.exercises[a.ei - 1] : null;
    return `
    ${head}
    <section class="card mark stack ex-anim" style="gap:16px">
      <div class="head-row" style="align-items:flex-end">
        <span class="ex-num">${pad(a.ei + 1)}<span style="-webkit-text-stroke:0;color:var(--muted);font-size:26px"> / ${pad(a.exercises.length)}</span></span>
        <span class="planned"><b>${e.planned}</b> série${e.planned > 1 ? "s" : ""} prévue${e.planned > 1 ? "s" : ""}</span>
      </div>
      <h2 class="ex-title">${esc(e.name)}</h2>
      ${lastBlock}
      <button class="btn primary huge" type="button" data-action="run-ok" data-autofocus>OK, c'est parti</button>
      <div class="side-actions">
        <button class="btn ghost sm" type="button" data-action="run-skip">Passer cet exercice</button>
        ${prev && !prev.skipped ? `<button class="btn ghost sm" type="button" data-action="run-addprev">+ 1 série sur ${esc(prev.name)}</button>` : ""}
      </div>
    </section>
    ${endControls}`;
  }
  const n = e.sets.length + 1, total = Math.max(e.planned, n);
  const lastSame = last && last.sets[n - 1];
  const okLabel = n >= e.planned ? (a.ei === a.exercises.length - 1 ? "OK · fin de séance" : "OK · exercice suivant") : "OK · série suivante";
  return `
  ${head}
  <section class="card mark stack" id="run-card" style="gap:14px">
    <h2 class="ex-title sm">${esc(e.name)}</h2>
    <div class="set-line">
      <span class="set-n">Série <b>${n}</b> / ${total}</span>
      <div class="dots" aria-label="${e.sets.length} séries faites sur ${total}">${Array.from({length: total}, (_, i) => `<i class="${i < e.sets.length ? "done" : i === e.sets.length ? "cur" : ""}${S.justDone === i ? " just" : ""}"></i>`).join("")}</div>
    </div>
    <form class="stack" id="set-form" style="gap:12px" novalidate autocomplete="off">
      <div class="set-inputs">
        <div class="numbox">
          <label for="in-reps">Répétitions</label>
          <input id="in-reps" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" placeholder="0" data-autofocus>
          <div class="steps"><button type="button" data-step="reps" data-d="-1" aria-label="Une rép de moins">−1</button><button type="button" data-step="reps" data-d="1" aria-label="Une rép de plus">+1</button></div>
        </div>
        <div class="numbox">
          <label for="in-kg">Poids (kg)</label>
          <input id="in-kg" inputmode="decimal" enterkeyhint="done" placeholder="0">
          <div class="steps"><button type="button" data-step="kg" data-d="-2.5" aria-label="2,5 kg de moins">−2,5</button><button type="button" data-step="kg" data-d="2.5" aria-label="2,5 kg de plus">+2,5</button></div>
        </div>
      </div>
      ${lastSame ? `<p class="hint">Série ${n} la dernière fois : <b style="color:var(--ink)">${lastSame.reps} × ${kgf(+lastSame.kg || 0)} kg</b></p>` : ""}
      <p class="pr-hint" id="pr-hint" hidden>${ic("flame")}Record en vue !</p>
      <button class="btn primary huge" type="submit">${okLabel}</button>
    </form>
    ${e.sets.length ? `
    <div>
      <span class="kicker">Aujourd'hui</span>
      <ul class="today-sets">${e.sets.map((s, i) => S.fixing === i
        ? `<li><div class="fix"><span class="sn">${i+1}</span><input class="in" id="fix-reps" inputmode="numeric" value="${esc(s.reps)}" aria-label="Répétitions"><span class="muted">×</span><input class="in" id="fix-kg" inputmode="decimal" value="${esc(kgf(+s.kg || 0))}" aria-label="Poids"></div><span class="fix"><button class="btn sm primary" type="button" data-action="fix-save" data-i="${i}">OK</button><button class="btn sm ghost" type="button" data-action="fix-cancel">Annuler</button></span></li>`
        : `<li class="${S.justDone === i ? "just" : ""}"><span><span class="sn">${i+1}</span>${s.reps} × ${kgf(+s.kg || 0)} kg</span><button class="btn ghost sm" type="button" data-action="fix" data-i="${i}">Corriger</button></li>`).join("")}</ul>
    </div>` : ""}
    <div class="side-actions">
      <button class="btn ghost sm" type="button" data-action="run-addset">+ Série</button>
      ${e.planned > Math.max(1, e.sets.length + 1) ? `<button class="btn ghost sm" type="button" data-action="run-rmset">− Série</button>` : ""}
      <button class="btn ghost sm" type="button" data-action="run-skip">${e.sets.length ? "Exercice suivant" : "Passer l'exercice"}</button>
    </div>
  </section>
  ${endControls}`;
}
function viewSummary(){
  const sm = S.summary, s = sm.session;
  const totalSets = s.exercises.reduce((t, e) => t + e.sets.length, 0);
  const vol = s.exercises.reduce((t, e) => t + volOf(e.sets), 0);
  const mins = s.endedAt && s.startedAt ? Math.max(1, Math.round((s.endedAt - s.startedAt) / 60000)) : null;
  const rows = s.exercises.map(e => {
    const prev = sm.prev[keyOf(e.name)], v = volOf(e.sets);
    let cmp = `<span class="muted small">1re fois</span>`;
    if (prev){ const dv = v - volOf(prev.sets); cmp = dv > 0 ? `<span class="up small">+${intf(dv)} kg</span>` : dv < 0 ? `<span class="down small">−${intf(-dv)} kg</span>` : `<span class="muted small">=</span>`; }
    const isPr = sm.prs.some(p => keyOf(p.name) === keyOf(e.name));
    return `<div class="sum-ex"><div class="t"><span>${esc(e.name)} ${isPr ? `<span class="chip gold">${ic("flame")}record</span>` : ""}</span>${cmp}</div><div class="d">${esc(setsTxt(e.sets))} · ${intf(v)} kg</div></div>`;
  }).join("");
  return `
  <section class="card mark done-hero">
    <div class="trophy">${TROPHY}</div>
    <span class="kicker">Séance terminée et enregistrée</span>
    <h2 class="ex-title">${esc(s.programName)}</h2>
    <span class="muted">${esc(fmtDate(s.date, {weekday:"long", day:"numeric", month:"long"}))}</span>
  </section>
  <section class="sum-grid">
    <div class="tile"><div class="l">Volume</div><div class="v"><span data-count="${Math.round(vol)}">0</span><small> kg</small></div>${sm.prevVol != null ? `<div class="s">${vol >= sm.prevVol ? `<span class="up">+${intf(vol - sm.prevVol)}</span>` : `<span class="down">−${intf(sm.prevVol - vol)}</span>`} vs dernière</div>` : `<div class="s">1re fois</div>`}</div>
    <div class="tile"><div class="l">Séries</div><div class="v"><span data-count="${totalSets}">0</span></div><div class="s">${plural(s.exercises.length, "exercice")}</div></div>
    <div class="tile"><div class="l">Durée</div><div class="v">${mins != null ? `<span data-count="${mins}">0</span><small> min</small>` : "—"}</div><div class="s">au total</div></div>
  </section>
  ${sm.prs.length ? `<section class="tile gold"><div class="l">${ic("flame")}${sm.prs.length > 1 ? "Nouveaux records" : "Nouveau record"}</div><div class="records" style="margin-top:6px">${sm.prs.map(p => `<div>${ic("trophy")}${esc(p.name)} · ${p.kg > 0 ? kgf(p.kg) + " kg" : p.reps + " reps"}</div>`).join("")}</div></section>` : ""}
  <section class="card"><h3 class="section-title" style="margin-bottom:4px">Détail</h3>${rows}</section>
  <div class="stack"><button class="btn primary big full" type="button" data-action="sum-close">Fermer le résumé</button><a class="btn big full" href="#progression">${ic("chart")} Voir ma progression</a></div>`;
}

/* ================= Onglet Progression ================= */
const METRICS = {
  max:{label:"Charge max", unit:"kg", key:"maxKg"},
  e1rm:{label:"1RM estimé", unit:"kg", key:"bestE"},
  vol:{label:"Volume", unit:"kg", key:"vol"},
  reps:{label:"Reps max", unit:"reps", key:"maxReps"}
};
function spark(points, id){
  const vals = points.slice(-10).map(p => p.maxKg > 0 ? p.maxKg : p.maxReps);
  if (vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), w = 64, h = 24;
  const xy = vals.map((v, i) => [i / (vals.length - 1) * (w - 6) + 3, mx === mn ? h / 2 : h - 4 - (v - mn) / (mx - mn) * (h - 8)]);
  const lp = xy[xy.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg${id}" x1="0" x2="1"><stop offset="0" stop-color="#C9A24B" stop-opacity=".35"/><stop offset="1" stop-color="#E6C77A"/></linearGradient></defs><polyline fill="none" stroke="url(#sg${id})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/><circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="3" fill="#E6C77A"/></svg>`;
}
function viewProgression(A){
  if (!S.sessions.length) return `${localBanner()}${pageHead("Progression")}<div class="card empty">${ILLU_BARBELL}<strong>Pas encore de données</strong><span>Termine ta première séance : tes courbes de progression apparaîtront ici, rangées par séance.</span><a class="btn primary big" href="#seance">Aller à la séance du jour</a></div>`;
  const seen = new Set();
  const groups = S.programs.map(p => {
    const keys = [];
    for (const e of p.exercises){ const k = keyOf(e.name); if (k && !keys.some(x => x.k === k)) keys.push({k, name:e.name}); }
    keys.forEach(x => seen.add(x.k));
    return {title:p.name, items:keys};
  });
  const others = Object.keys(A.perEx).filter(k => !seen.has(k)).map(k => ({k, name:A.perEx[k].name}));
  if (others.length) groups.push({title:"Autres exercices", items:others});
  if (!S.progKey || !A.perEx[S.progKey]){
    const f = groups.flatMap(g => g.items).find(x => A.perEx[x.k]);
    S.progKey = f ? f.k : null; S.progMetric = null;
  }
  let panel = "";
  if (S.progKey){
    const pe = A.perEx[S.progKey], pts = pe.points, b = A.best[S.progKey];
    const hasKg = pts.some(p => p.maxKg > 0);
    if (!S.progMetric) S.progMetric = hasKg ? "max" : "reps";
    const M = METRICS[S.progMetric];
    const val = p => S.progMetric === "e1rm" ? Math.round(p.bestE * 2) / 2 : p[M.key];
    const fmtV = v => M.unit === "reps" ? intf(v) : S.progMetric === "vol" ? intf(v) : kgf(v);
    const first = val(pts[0]), lastV = val(pts[pts.length - 1]), diff = lastV - first;
    const pct = first > 0 ? Math.round(diff / first * 100) : 0;
    let bestP = pts[0]; for (const p of pts) if (val(p) >= val(bestP)) bestP = p;
    panel = `
    <section class="card mark stack" id="prog-panel" style="gap:14px">
      <div class="head-row"><h2 class="section-title" style="font-size:30px">${esc(pe.name)}</h2><span class="chip">${plural(pts.length, "séance")}</span></div>
      <div class="seg" role="group" aria-label="Mesure affichée">
        ${Object.entries(METRICS).map(([k, m]) => `<button type="button" data-action="metric" data-m="${k}" aria-pressed="${k === S.progMetric}">${m.label}</button>`).join("")}
      </div>
      <div class="tiles">
        <div class="tile gold"><div class="l">${ic("flame")}Record ${esc(M.label.toLowerCase())}</div><div class="v"><span data-count="${val(bestP)}" data-dec="${M.unit === "kg" && S.progMetric !== "vol" ? 1 : 0}">0</span><small> ${M.unit}</small></div><div class="s">${esc(fmtDate(bestP.date, {day:"numeric", month:"short", year:"numeric"}))}</div></div>
        <div class="tile"><div class="l">Évolution</div><div class="v">${pts.length > 1 ? `<span class="${diff > 0 ? "up" : diff < 0 ? "down" : ""}" style="font-weight:400">${diff >= 0 ? "+" : "−"}${fmtV(Math.abs(diff))}</span><small> ${M.unit}</small>` : "—"}</div><div class="s">${pts.length > 1 ? `${diff >= 0 ? "+" : "−"}${Math.abs(pct)} % depuis le ${esc(fmtDate(pts[0].date, {day:"numeric", month:"short"}))}` : "une seule séance"}</div></div>
      </div>
      <div class="chart-box"><canvas id="chart" role="img" aria-label="${esc(M.label)} de ${esc(pe.name)} par séance"></canvas></div>
      ${window.Chart ? "" : `<p class="muted small">Le graphique n'a pas pu se charger. Les valeurs sont dans le détail ci-dessous.</p>`}
      <details>
        <summary>Détail des séances</summary>
        <div class="table-wrap" style="margin-top:6px"><table class="data">
          <thead><tr><th>Date</th><th>Séries</th><th class="r">${esc(M.label)}</th></tr></thead>
          <tbody>${[...pts].reverse().map(p => `<tr><td style="white-space:nowrap">${esc(fmtDate(p.date, {day:"numeric", month:"short"}))}</td><td>${esc(setsTxt(p.sets))}</td><td class="r" style="white-space:nowrap">${fmtV(val(p))} ${M.unit}</td></tr>`).join("")}</tbody>
        </table></div>
      </details>
    </section>`;
  }
  let sid = 0;
  const groupHtml = groups.map(g => `
    <section class="card grp">
      <h3>${ic(g.title === "Autres exercices" ? "kettlebell" : "dumbbell")}${esc(g.title)}</h3>
      <div class="ex-btns">${g.items.length ? g.items.map(x => {
        const pe = A.perEx[x.k];
        if (!pe) return `<button class="ex-btn" type="button" disabled><span class="n muted">${esc(x.name)}</span><span class="m" style="font-family:var(--font-body);font-size:13px">pas encore fait</span></button>`;
        const lp = pe.points[pe.points.length - 1];
        return `<button class="ex-btn" type="button" data-action="prog-ex" data-k="${esc(x.k)}" aria-pressed="${x.k === S.progKey}"><span class="n">${esc(pe.name)}</span><span class="m">${lp.maxKg > 0 ? kgf(lp.maxKg) + " kg" : lp.maxReps + " reps"}${spark(pe.points, sid++)}</span></button>`;
      }).join("") : `<span class="muted small" style="padding:8px 0">Aucun exercice dans cette séance.</span>`}</div>
    </section>`).join("");
  return `${localBanner()}${pageHead("Progression")}${panel}<h2 class="section-title" style="margin-top:4px">Par séance</h2>${groupHtml}${viewHistory(A)}`;
}
function viewHistory(A){

      <article class="hist">
        <h4>${esc(fmtDate(s.date, {weekday:"short", day:"numeric", month:"short"}))} · ${esc(s.programName || s.title || "Séance")}${prs.length ? `<span class="chip gold">${ic("flame")}${plural(prs.length, "record")}</span>` : ""}</h4>
